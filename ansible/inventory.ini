# Inventory for the Vehicle Service Booking Portal target node(s).
#
# Option A - configure the machine you are logged in to (WSL2 Ubuntu with systemd, an Ubuntu VM, ...):
[vsbp_servers]
vsbp-node ansible_connection=local

# Option B - configure a remote Ubuntu server over SSH (comment out Option A first):
# vsbp-node ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[vsbp_servers:vars]
ansible_python_interpreter=/usr/bin/python3
