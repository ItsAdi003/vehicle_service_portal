---
# ---- 1. Packages -------------------------------------------------------------------------
- name: Install the Java runtime and curl
  ansible.builtin.apt:
    name:
      - "{{ vsbp_java_package }}"
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [packages]

# ---- 2. User, group and folders ----------------------------------------------------------
- name: Create the application group
  ansible.builtin.group:
    name: "{{ vsbp_group }}"
    system: true
    state: present
  tags: [user]

- name: Create the application user (no login shell)
  ansible.builtin.user:
    name: "{{ vsbp_user }}"
    group: "{{ vsbp_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ vsbp_base_dir }}"
    create_home: false
    state: present
  tags: [user]

- name: Create the application folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ vsbp_group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ vsbp_base_dir }}", owner: root, mode: "0755" }
    - { path: "{{ vsbp_releases_dir }}", owner: root, mode: "0755" }
    - { path: "{{ vsbp_config_dir }}", owner: root, mode: "0750" }
    - { path: "{{ vsbp_data_dir }}", owner: "{{ vsbp_user }}", mode: "0750" }
    - { path: "{{ vsbp_log_dir }}", owner: "{{ vsbp_user }}", mode: "0750" }
  tags: [dirs]

# ---- 3. Release (versioned artefact + "current" symlink) ----------------------------------
- name: Check that the WAR exists on the control node
  ansible.builtin.stat:
    path: "{{ vsbp_artifact_src }}"
  delegate_to: localhost
  become: false
  register: vsbp_artifact
  tags: [release]

- name: Stop with a helpful message when the WAR has not been built
  ansible.builtin.assert:
    that: vsbp_artifact.stat.exists
    fail_msg: "{{ vsbp_artifact_src }} not found. Build it first: mvn clean package -DskipTests"
    quiet: true
  tags: [release]

- name: Look at the release that is active now
  ansible.builtin.stat:
    path: "{{ vsbp_base_dir }}/current"
  register: vsbp_current
  tags: [release]

- name: Remember the active release version
  ansible.builtin.set_fact:
    vsbp_active_version: "{{ vsbp_current.stat.lnk_target | basename }}"
  when: vsbp_current.stat.islnk | default(false)
  tags: [release]

- name: Create the release folder
  ansible.builtin.file:
    path: "{{ vsbp_releases_dir }}/{{ vsbp_version }}"
    state: directory
    owner: root
    group: "{{ vsbp_group }}"
    mode: "0755"
  tags: [release]

- name: Copy the WAR into the release folder
  ansible.builtin.copy:
    src: "{{ vsbp_artifact_src }}"
    dest: "{{ vsbp_releases_dir }}/{{ vsbp_version }}/vehicle-service-portal.war"
    owner: root
    group: "{{ vsbp_group }}"
    mode: "0644"
  notify: Restart vsbp
  tags: [release]

- name: Record the previous release (used by rollback.yml)
  ansible.builtin.copy:
    content: "{{ vsbp_active_version }}\n"
    dest: "{{ vsbp_base_dir }}/previous_version"
    owner: root
    group: "{{ vsbp_group }}"
    mode: "0644"
  when: vsbp_active_version is defined and vsbp_active_version != vsbp_version
  tags: [release]

- name: Point "current" at this release
  ansible.builtin.file:
    src: "{{ vsbp_releases_dir }}/{{ vsbp_version }}"
    dest: "{{ vsbp_base_dir }}/current"
    state: link
    force: true
  notify: Restart vsbp
  tags: [release]

# ---- 4. Configuration files -------------------------------------------------------------
- name: Write the environment file
  ansible.builtin.template:
    src: vsbp.env.j2
    dest: "{{ vsbp_config_dir }}/vsbp.env"
    owner: root
    group: "{{ vsbp_group }}"
    mode: "0640"
  notify: Restart vsbp
  tags: [config]

- name: Install the systemd unit
  ansible.builtin.template:
    src: vsbp.service.j2
    dest: /etc/systemd/system/vsbp.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vsbp
  tags: [config]

# ---- 5. Service -----------------------------------------------------------------------------
- name: Apply pending restarts now so the health check sees the new release
  ansible.builtin.meta: flush_handlers
  tags: [service]

- name: Enable the service at boot and make sure it is running
  ansible.builtin.systemd:
    name: vsbp
    enabled: true
    state: started
  tags: [service]

# ---- 6. Health check -------------------------------------------------------------------------
- name: Wait until the application reports UP
  ansible.builtin.uri:
    url: "{{ vsbp_health_url }}"
    return_content: true
  register: vsbp_health
  until: vsbp_health.status == 200 and ('"status":"UP"' in (vsbp_health.content | default('')))
  retries: 24
  delay: 5
  changed_when: false
  tags: [health]
