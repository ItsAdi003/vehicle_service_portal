<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Vehicle Service Portal'">Vehicle Service Portal</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header" class="site-header">
  <div class="container nav-bar">
    <a class="brand" th:href="@{/}">Vehicle Service Portal</a>
    <nav id="main-nav">
      <a th:href="@{/}">Home</a>
      <a th:if="${me != null}" th:href="@{/slots}" id="nav-slots">Available slots</a>
      <a th:if="${me != null and !me.admin}" th:href="@{/bookings}" id="nav-bookings">My bookings</a>
      <a th:if="${me != null and me.admin}" th:href="@{/admin/bookings}" id="nav-admin">Admin bookings</a>
      <a th:if="${me == null}" th:href="@{/login}" id="nav-login">Login</a>
      <a th:if="${me == null}" th:href="@{/register}" id="nav-register">Register</a>
      <form th:if="${me != null}" th:action="@{/logout}" method="post" class="inline">
        <span id="current-user" th:text="${me.name}">User</span>
        <button id="logout-btn" type="submit" class="link-button">Logout</button>
      </form>
    </nav>
  </div>
</header>

<div th:fragment="flash" class="container">
  <div th:if="${success}" id="flash-success" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" id="flash-error" class="alert alert-error" th:text="${error}"></div>
</div>

<footer th:fragment="footer" class="site-footer">
  <div class="container">
    Environment: <strong id="env-badge" th:text="${appEnvironment}">local</strong>
    &middot; Version <span id="app-version" th:text="${appVersion}">dev</span>
  </div>
</footer>

</body>
</html>
