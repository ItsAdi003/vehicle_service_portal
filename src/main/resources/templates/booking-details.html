<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Booking details')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
  <div class="card">
    <h1 id="page-title" th:text="'Booking #' + ${booking.id}">Booking #1</h1>
    <p>Status:
      <span id="booking-status" class="badge" th:classappend="${'status-' + booking.status.name().toLowerCase()}"
            th:text="${booking.status}">REQUESTED</span>
    </p>

    <dl>
      <dt>Slot</dt><dd id="detail-slot" th:text="${booking.slot.dateLabel} + ' at ' + ${booking.slot.timeLabel}">Thu, 22 Oct 2026 at 09:00</dd>
      <dt>Vehicle</dt><dd id="detail-vehicle" th:text="${booking.vehicleNumber} + ' - ' + ${booking.vehicleModel}">MH12AB1234 - Honda City</dd>
      <dt>Service</dt><dd id="detail-service" th:text="${booking.serviceType.label}">Oil change</dd>
      <dt>Customer</dt><dd id="detail-customer" th:text="${booking.user.fullName}">Asha Rao</dd>
      <dt th:if="${booking.notes != null}">Notes</dt><dd th:if="${booking.notes != null}" id="detail-notes" th:text="${booking.notes}">-</dd>
    </dl>

    <h2>Timeline</h2>
    <ol id="timeline">
      <li id="timeline-requested">Requested - <span th:text="${booking.requestedAtLabel}">time</span></li>
      <li id="timeline-confirmed" th:if="${booking.confirmedAt != null}">Confirmed - <span th:text="${booking.confirmedAtLabel}">time</span></li>
      <li id="timeline-completed" th:if="${booking.completedAt != null}">Completed - <span th:text="${booking.completedAtLabel}">time</span></li>
      <li id="timeline-cancelled" th:if="${booking.cancelledAt != null}">Cancelled - <span th:text="${booking.cancelledAtLabel}">time</span></li>
    </ol>

    <div class="form-actions">
      <a class="btn" th:href="${me.admin} ? @{/admin/bookings} : @{/bookings}">Back to list</a>
    </div>
  </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
