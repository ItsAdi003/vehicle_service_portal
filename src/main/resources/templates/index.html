<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Home')}"></head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
  <section class="hero">
    <h1 id="page-title">Book your vehicle service in minutes</h1>
    <p>See open service slots, request an appointment, and follow its status until your vehicle is ready.</p>
    <p th:if="${me == null}" class="form-actions">
      <a id="cta-register" class="btn" th:href="@{/register}">Create an account</a>
      <a id="cta-login" th:href="@{/login}">Log in</a>
    </p>
    <p th:if="${me != null}" id="welcome-message">Welcome back, <strong th:text="${me.name}">Customer</strong>.</p>
    <p th:if="${me != null}"><a id="cta-slots" class="btn" th:href="@{/slots}">View available slots</a></p>
  </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
