spring.application.name=vehicle-service-portal

# Filled in by Maven resource filtering (mvn package -Dapp.environment=staging).
# At runtime the env var APP_ENVIRONMENT overrides it without rebuilding.
app.environment=@app.environment@
app.version=@project.version@

# Database: H2 file database by default, one file per environment. Override with DB_URL / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vsbp-@app.environment@}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health endpoint used by Jenkins, Docker HEALTHCHECK and Ansible
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.servlet.session.timeout=30m
server.error.include-message=never
